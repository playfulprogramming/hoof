services:
  app:
    build: .
    image: playful-programming-hoof:latest
    env_file:
      - .env
    environment:
      NODE_USE_ENV_PROXY: 1
      NODE_EXTRA_CA_CERTS: /var/app/e2e/mocks/src/generated/cert.pem
      HTTP_PROXY: http://proxy:3999
      HTTPS_PROXY: http://proxy:3999
      NO_PROXY: "localhost, 127.0.0.1"
      S3_ENDPOINT: http://rustfs:9000
      POSTGRES_URL: postgresql://postgres:unicorn@pgsql:5432/${E2E_POSTGRES_DATABASE}
      REDIS_URL: redis://redis:6379
      BULLMQ_PREFIX: ${E2E_BULLMQ_PREFIX}
    volumes:
      - ./e2e:/var/app/e2e:ro
    networks: [shared]
    ports:
      - "${E2E_PORT}:3000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://0.0.0.0:3000 && wget --no-verbose --tries=1 --spider http://0.0.0.0:3001 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 100ms
    post_start:
      - command: node packages/db/scripts/migrate.ts

networks:
  shared:
    name: hoof_shared_network
    external: true
